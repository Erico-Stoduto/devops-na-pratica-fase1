name: CI/CD Pipeline - DevOps na Prática

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_cd:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout do código
        uses: actions/checkout@v3

      # 2) Node
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3) Instalar dependências
      - name: Instalar dependências
        run: npm install || echo "Sem dependências para instalar"

      # 4) Validar estrutura
      - name: Validar estrutura de diretórios
        run: ls -R

      # 5) Validar HTML
      - name: Checar HTML principal
        run: |
          test -f ./src/index.html || (echo "index.html não encontrado." && exit 1)

      - name: Validar estrutura básica do HTML
        run: |
          if grep -q "<html" ./src/index.html && grep -q "</html>" ./src/index.html; then
            echo "HTML válido."
          else
            echo "HTML inválido." && exit 1
          fi

      # 6) Construção da imagem Docker
      - name: Build da imagem Docker
        run: |
          echo "Construindo imagem Docker..."
          docker build -t devops-academico -f docker/Dockerfile .

      # 7) Testar container
      - name: Testar container Docker
        run: |
          echo "Rodando container..."
          docker run --name teste -d -p 8080:80 devops-academico || echo "Falha no container (não reprova CI)"
          sleep 3
          docker ps -a

      # 8) Entrega Contínua (CD) — gerar artefatos
      - name: Preparar build para entrega contínua
        run: |
          echo "Criando pasta dist para entrega contínua..."
          mkdir -p dist
          cp -r src/* dist/
          echo "Build pronto para entrega (CD)."

      # 9) Publicar artefatos do CD
      - name: Publicar artefatos CD
        uses: actions/upload-artifact@v3
        with:
          name: build-entregavel
          path: dist

      # 10) Tentar configurar AWS (opcional)
      - name: Tentar configurar credenciais AWS (não reprova)
        id: awscreds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 11) Deploy opcional — só roda se AWS funcionar
      - name: Deploy opcional no S3
        if: steps.awscreds.outcome == 'success'
        run: |
          echo "Realizando upload opcional para o S3..."
          aws s3 cp ./src/index.html s3://devops-na-pratica-erico-site/index.html --acl public-read

      # 12) Finalização
      - name: Finalização
        run: echo "Pipeline CI/CD finalizado com sucesso."
