name: CI/CD Pipeline - DevOps na Prática

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install || echo "Sem dependências para instalar"

      - name: Validar estrutura de diretórios
        run: ls -R

      - name: Testar HTML principal
        run: |
          test -f ./src/index.html || (echo "index.html não encontrado." && exit 1)

      - name: Validar estrutura básica do HTML
        run: |
          if grep -q "<html" ./src/index.html && grep -q "</html>" ./src/index.html; then
            echo "HTML válido."
          else
            echo "HTML inválido." && exit 1
          fi

      # CONFIGURAR AWS — mas NÃO quebrar o pipeline se falhar
      - name: Tentar configurar credenciais AWS
        id: awscreds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # DEPLOY SÓ SE A CONFIGURAÇÃO AWS TIVER SUCESSO
      - name: Deploy no S3
        if: steps.awscreds.outcome == 'success'
        run: |
          echo "Realizando upload para o S3..."
          aws s3 cp ./src/index.html s3://devops-na-pratica-erico-site/index.html --acl public-read

      - name: Finalização
        run: echo "Pipeline executado. Deploy só roda se AWS estiver ativa."
