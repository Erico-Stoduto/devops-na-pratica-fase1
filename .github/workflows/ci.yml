name: CI/CD Pipeline - DevOps na Prática

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install || echo "Sem dependências para instalar"

      - name: Validar estrutura de diretórios
        run: ls -R

      - name: Testar HTML principal
        run: |
          test -f ./src/index.html || (echo "index.html não encontrado." && exit 1)

      - name: Validar estrutura básica do HTML
        run: |
          if grep -q "<html" ./src/index.html && grep -q "</html>" ./src/index.html; then
            echo "HTML válido."
          else
            echo "HTML inválido." && exit 1
          fi

      # CONFIGURAR AWS ACADEMY (AGORA NÃO IGNORA ERRO)
      - name: Configurar credenciais AWS
        id: awscreds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # CRIAR BUCKET SE NÃO EXISTIR
      - name: Criar bucket S3 (se não existir)
        run: |
          aws s3api head-bucket --bucket devops-na-pratica-erico-site 2>/dev/null \
          || aws s3api create-bucket --bucket devops-na-pratica-erico-site --region us-east-1

      # TORNAR BUCKET PÚBLICO
      - name: Permitir acesso público ao bucket
        run: |
          aws s3api put-bucket-acl \
            --bucket devops-na-pratica-erico-site \
            --acl public-read

      # CONFIGURAR SITE ESTÁTICO
      - name: Ativar website estático
        run: |
          aws s3 website s3://devops-na-pratica-erico-site/ \
            --index-document index.html \
            --error-document index.html

      # DEPLOY DA PÁGINA
      - name: Upload do index.html
        run: |
          aws s3 cp ./src/index.html s3://devops-na-pratica-erico-site/index.html --acl public-read

      - name: Finalização
        run: echo "Deploy concluído com sucesso no S3."
