name: CI/CD Pipeline - DevOps na Prática

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.AWS_SESSION_TOKEN != '' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install || echo "Sem dependências para instalar"

      - name: Validar estrutura de diretórios
        run: ls -R

      - name: Testar HTML principal
        run: |
          test -f ./src/index.html && echo "index.html encontrado." || (echo "index.html não encontrado." && exit 1)

      - name: Validar estrutura básica do HTML
        run: |
          if grep -q "<html" ./src/index.html && grep -q "</html>" ./src/index.html; then
            echo "HTML válido."
          else
            echo "HTML inválido." && exit 1
          fi

      - name: Configurar credenciais AWS
        if: env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy do site no S3
        if: env.HAS_AWS_KEYS == 'true'
        run: |
          echo "Realizando upload para o S3..."
          aws s3 cp ./src/index.html s3://devops-na-pratica-erico-site/index.html --acl public-read || echo "AWS indisponível ou bucket não existe"

      - name: Finalização
        run: echo "Pipeline CI/CD concluído. Deploy só executado se AWS estiver ativa."
